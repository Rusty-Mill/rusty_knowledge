[package]
name = "rusty-knowledge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "3.1.2", features = ["macros", "server", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusty_regx = { git = "https://github.com/baileyrd/rusty_regx", rev = "93c5541d6713750141476c87d6cd774629e1ae3a" }
# The ecosystem's own sovereign HTTP client (no reqwest/hyper) -- used
# only by store::OnyxEmbedder, an opt-in real embedding backend behind
# EMBEDDING_BACKEND=onyx (see that type's doc comment). `tokio` feature:
# runs on this crate's own real-tokio runtime (already started by
# `#[tokio::main]` in main.rs) instead of pulling in a second,
# rusty_request-native async runtime alongside it.
rusty_request = { git = "https://github.com/baileyrd/rusty_request", rev = "ebd1fed32dcd6958cab2c9c93ec8c04b3e7fd07a", features = [
    "tokio",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
