[package]
name = "rusty-knowledge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
rmcp = { version = "3.1.2", features = ["macros", "server", "transport-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusty-embedder-core = { git = "https://github.com/baileyrd/rusty_embedder", rev = "6add27a4c808aa153a5a22fc9d8cc0b81f4961ec" }
rusty-embedder-http = { git = "https://github.com/baileyrd/rusty_embedder", rev = "6add27a4c808aa153a5a22fc9d8cc0b81f4961ec", optional = true }
rusty-embedder-local = { git = "https://github.com/baileyrd/rusty_embedder", rev = "6add27a4c808aa153a5a22fc9d8cc0b81f4961ec", optional = true }
rusty_regx = { git = "https://github.com/baileyrd/rusty_regx", rev = "93c5541d6713750141476c87d6cd774629e1ae3a" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sqlite-vec = "0.1.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[features]
default = []
# Real embedding backends are opt-in: the default build depends only on
# rusty-embedder-core (the Embedder trait + zero-dependency NullEmbedder),
# so hybrid search is available in the code path but inert -- byte-for-byte
# today's lexical-only behavior -- until a caller both compiles in a real
# backend and configures it via EMBEDDING_BACKEND at runtime.
local-embeddings = ["dep:rusty-embedder-local"]
http-embeddings = ["dep:rusty-embedder-http"]
